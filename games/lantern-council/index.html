<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142326"><title>冬至の灯 | LANTERN COUNCIL</title><meta name="description" content="三人の自律エージェントと九日間を生き抜く創発型シミュレーション"><style>:root{color-scheme:dark;--bg:#142326;--panel:#203235;--line:#405353;--ink:#f5edda;--mut:#b4c1b9;--gold:#f1c47c;--green:#8bd2bb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 70% 0,#344743,transparent 55%),var(--bg);font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1060px;margin:auto;padding:20px max(15px,env(safe-area-inset-left)) max(35px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}a{color:var(--mut)}.eyebrow{color:var(--gold);font:11px/1.6 ui-monospace,monospace;letter-spacing:.12em}h1{font-size:clamp(38px,7vw,68px);letter-spacing:-.06em;line-height:1.05;margin:16px 0 6px}h2{font-size:22px;margin:0 0 10px;line-height:1.3}p{margin:8px 0 14px}.mut{color:var(--mut);font-size:12px}.hero{padding:15px 0}.map{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px;background:#172f34}.meters,.people{display:grid;gap:7px;margin:12px 0}.meters{grid-template-columns:repeat(4,minmax(0,1fr))}.people{grid-template-columns:repeat(3,minmax(0,1fr))}.meter,.panel,.person{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}.meter,.person{padding:10px}.meter strong{display:block;font-size:clamp(20px,4vw,28px);font-variant-numeric:tabular-nums;color:var(--gold)}.bar{height:5px;border-radius:9px;background:#425654;overflow:hidden;margin:5px 0}.bar span{display:block;height:100%;background:var(--green)}.person strong{font-size:18px}.person p{margin:4px 0}.stat{display:flex;justify-content:space-between;font-size:12px;gap:2px}.layout{display:grid;gap:12px}.panel{padding:clamp(1 <svg class="map" viewBox="0 0 620 216" role="img" aria-label="港・工房・高台を結ぶ孤島の地図"><defs><pattern id="waves" width="32" height="14" patternUnits="userSpaceOnUse"><path d="M0 7Q8 2 16 7T32 7" fill="none" stroke="#314a4e"/></pattern><radialGradient id="glow"><stop stop-color="#f5d28d" stop-opacity=".65"/><stop offset="1" stop-color="#f5d28d" stop-opacity="0"/></radialGradient></defs><rect width="620" height="216" fill="#162e34"/><rect width="620" height="216" fill="url(#waves)"/><path d="M102 145Q58 85 180 55L268 34 357 50 450 89 484 152 408 184 238 196Z" fill="#405a51" stroke="#71847a" stroke-width="2"/><path d="M100 155Q184 213 403 188" stroke="#dbb67b" stroke-width="5" stroke-dasharray="5 4" fill="none" id="wallmap"/><path d="M150 135L285 113L390 83" stroke="#a4b3a3" stroke-width="2" stroke-dasharray="5 5" fill="none"/><g fill="#243a3b" stroke="#a4b3a3" stroke-width="2"><rect x="116" y="103" width="47" height="29" rx="4"/><rect x="259" y="78" width="51" height="34" rx="3"/></g><circle id="lightglow" cx="393" cy="68" r="57" fill="url(#glow)"/><path d="M381 94L385 48H400L404 94Z" fill="#e7c78d" stroke="#26383b" stroke-width="2"/><rect x="382" y="42" width="20" height="12" rx="3" fill="#fff2b8"/><path d="M392 45L555 17 555 82Z" fill="#f5d28d" opacity=".12" id="beam"/><g font-family="system-ui" font-size="13" fill="#f5edda"><text x="114" y="154">港区</text><text x="257" y="132">工房区</text><text x="373" y="117">高台区</text><text x="420" y="153" font-size="11">防潮堤</text><text id="weather" x="18" y="24" fill="#f1c47c">DAY 01</text></g></svg>
<div id="meters" class="meters"></div><div class="people" id="people"></div><div class="bonds" id="bonds"></div><div class="layout"><section class="panel" id="command"></section><aside class="panel"><div class="eyebrow">WORLD CHRONICLE</div><h2>島の記録</h2><div id="log"></div><details><summary>全日程の記録</summary><div id="past"></div></details></aside></div><div class="tools"><button class="secondary" id="reset">同じ島で再挑戦</button><button class="secondary" id="new">別の島を生成</button><span class="mut" id="seed"></span></div><p class="foot">人物は効用関数による自律エージェント。生成AIへの通信は行わない。架空の島を題材にしたゲームであり、現実の防災指針ではありません。</p><noscript>JavaScriptを有効にしてください。</noscript></main><script>
const E=(function engine(){
 const people=[{name:"ナギ",district:"港",role:"漁師",goal:"食料と互助",color:"#83d4bd",bias:[3,0,0,0,2]},{name:"イオ",district:"工房",role:"技師",goal:"防災と維持",color:"#edb877",bias:[0,3,0,2,0]},{name:"リツ",district:"高台",role:"通信士",goal:"救援と記録",color:"#b9a5e8",bias:[0,0,4,0,1]}];
 const weatherNames=["凪","濃霧","嵐"], policies=[["none","自主判断"],["food","食料"],["wall","防潮堤"],["light","灯台"],["material","資材"]];
 const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
 function hash(seed,n){let x=(seed^Math.imul(n+1,0x9e3779b1))>>>0;x=Math.imul(x^(x>>>16),0x85ebca6b)>>>0;x=Math.imul(x^(x>>>13),0xc2b2ae35)>>>0;return (x^(x>>>16))>>>0;}
 function weather(seed,d){if(d===1)return 0;if(d===9)return 1;let n=hash(seed,d)%10;return n<3?0:n<6?1:2;}
 function fresh(seed=19731){return {seed:seed>>>0,day:1,stock:9,material:6,wall:2,light:1,verified:0,p:[{food:5,hp:8,trust:5},{food:4,hp:8,trust:5},{food:4,hp:8,trust:5}],bonds:[3,3,3],history:[],log:[],milestones:[],end:null};}
 const bi=(i,j)=>i+j-1;
 function forecast(s,i){let real=weather(s.seed,s.day+1);if(s.verified===s.day&&s.p[i].trust>=4)return real;let h=hash(s.seed,s.day*11+i+51)%10;return h<(i===2?8:6)?real:(real+(h%2===0?1:2))%3;}
 function actions(s){if(s.end)return [];return [
 {id:"gather",title:"漂着資材の回収",desc:"共同資材 +4",ok:true},
 {id:"wall",title:"防潮堤の補強",desc:"資材 −3・防潮堤 +3",ok:s.material>=3&&s.wall<10},
 {id:"light",title:"灯台の修復",desc:"資材 −3・灯台 +3",ok:s.material>=3&&s.light<10},
 {id:"talk",title:"三地区の協議",desc:"信頼 +2・地区間の絆 +1",ok:s.p.some(p=>p.trust<10)||s.bonds.some(b=>b<6)},
 {id:"scout",title:"観測記録の照合",desc:"明日の正確な予報を信頼4以上の地区に共有",ok:s.day<9},
 {id:"fish",title:"共同の食料を確保",desc:"備蓄 +3（嵐は +1）",ok:true},
 ...people.map((a,i)=>({id:"food"+i,title:a.district+"区への配給",desc:"備蓄 −4・地区食料 +4・信頼 +1",ok:s.stock>=4&&s.p[i].food<=10}))];}
 function options(s,i,policy){
 const p=s.p[i],a=people[i],w=weather(s.seed,s.day),f=forecast(s,i),out=[];
 function add(id,title,score,detail,fx){let influence=p.trust>=4&&policy===id?1+(p.trust-4)*.45:0;out.push({id,title,score:score+influence,detail:detail+(influence?"／評議会の方針も考慮":""),fx});}
 const gain=Math.max(1,(i===0?6:5)-w*2);
 add("food","食料を調達",1+a.bias[0]+Math.max(0,7-p.food)*1.3-w*.8,"手持ち "+p.food+" 食。"+weatherNames[w]+"のため "+gain+" 食を得る。",()=>{p.food+=gain;});
 if(p.food<=4&&s.stock>=3)add("reserve","共同備蓄から受給",5+(4-p.food)*1.3+(w===2?2:0),"食料不足のため共同備蓄から3食。",()=>{s.stock-=3;p.food+=3;p.trust=clamp(p.trust+1,0,10);if(s.stock<3)for(let j=0;j<3;j++)if(j!==i&&s.p[j].food<3)s.bonds[bi(i,j)]=clamp(s.bonds[bi(i,j)]-1,0,6);});
 if(p.hp<9)add("rest","休養と手当",1+(10-p.hp)*1.65,"体力 "+p.hp+"。地区内の手当を優先する。",()=>p.hp=Math.min(10,p.hp+3));
 for(let j=0;j<3;j++){if(j===i)continue;let q=s.p[j],b=s.bonds[bi(i,j)];if(p.food>=6&&q.food<=3)add("share",people[j].district+"区へ食料を融通",2+a.bias[4]+(3-q.food)*1.8+b*.7,"隣区は "+q.food+" 食。2食を渡す。",()=>{p.food-=2;q.food+=2;s.bonds[bi(i,j)]=clamp(b+1,0,6);q.trust=clamp(q.trust+1,0,10);});if(p.food>=5&&p.hp>=6&&q.hp<=3)add("aid",people[j].district+"区の手当を支援",2+a.bias[4]+(4-q.hp)*1.5+b*.65,"隣区の体力 "+q.hp+"。食料1を持ち、手当に出向く。",()=>{p.food--;q.hp=Math.min(10,q.hp+3);s.bonds[bi(i,j)]=clamp(b+1,0,6);});}
 if(s.material>=2&&s.wall<10)add("wall","防潮堤を整備",1+a.bias[1]+(10-s.wall)*.45+(f===2?3:0)+(w===2?1.6:0),"翌日の見立ては"+weatherNames[f]+"。防潮堤 "+s.wall+"。",()=>{s.material-=2;s.wall=Math.min(10,s.wall+(i===1?3:2));});
 if(s.material>=2&&s.light<10)add("light","灯台を修復",.5+a.bias[2]+(10-s.light)*.35+s.day*.32-(f===2?1:0),"救援船まで "+(10-s.day)+" 日。灯台 "+s.light+"。",()=>{s.material-=2;s.light=Math.min(10,s.light+(i===2?3:2));});
 add("material","資材を回収",1+a.bias[3]+Math.max(0,5-s.material)*1.1-w*.5,"共同資材 "+s.material+"。不足に備える。",()=>s.material+=i===1?3:2);
 add("rest","地区の維持に専念",.5,"体力を少し回復する。",()=>p.hp=Math.min(10,p.hp+1));
 for(const o of out)if(["wall","light","material","share","aid"].includes(o.id))o.score-=Math.max(0,4-p.food)*1.3+Math.max(0,5-p.hp)*.6+(p.trust<4?1.8:0);
 return out.sort((x,y)=>y.score-x.score);
 }
 function ending(s){const healthy=s.p.filter(p=>p.hp>=4).length,unity=s.bonds.reduce((a,b)=>a+b,0);
 if(s.light>=8&&healthy===3&&unity>=12)return {title:"三つの灯がともる",text:"救援船が光を捉えた。三地区は互いの帳簿を持ち寄り、共同で救援計画を立てた。孤立した三つの灯は、ひとつの港の明かりになった。"};
 if(s.light>=8&&healthy===3)return {title:"それぞれの朝",text:"救援船は到着した。三地区は冬を越えたが、互いの距離は残る。それぞれの代表が別々の救援申請を持って船へ向かった。"};
 if(s.light>=8)return {title:"届いた光",text:"救援船は島を発見した。支援が必要な地区へ医療班が向かう。救援は成功したが、島の再建はここから始まる。"};
 if(healthy===3&&s.wall>=5)return {title:"海に残る街",text:"船は霧の向こうへ消えた。それでも三地区は嵐を耐えた。次の航路を待ちながら、代表たちは冬の備蓄を数え始める。"};
 return {title:"次の朝を待つ",text:"灯台の光は届かなかった。地区ごとの状況には差がある。評議会は残る食料と資材を数え、救援要請を組み立て直す。"};}
 function advance(old,id,policy="none"){
 if(old.end||!policies.some(p=>p[0]===policy))return null;const a=actions(old).find(a=>a.id===id&&a.ok);if(!a)return null;
 const s=JSON.parse(JSON.stringify(old)),w=weather(s.seed,s.day),lines=[];let t=a.desc;
 if(id==="gather")s.material+=4;
 if(id==="wall"){s.material-=3;s.wall=Math.min(10,s.wall+3);}
 if(id==="light"){s.material-=3;s.light=Math.min(10,s.light+3);}
 if(id==="talk"){s.p.forEach(p=>p.trust=clamp(p.trust+2,0,10));s.bonds=s.bonds.map(b=>clamp(b+1,0,6));}
 if(id==="scout"){s.verified=s.day;t="明日は「"+weatherNames[weather(s.seed,s.day+1)]+"」。観測結果を送信。";}
 if(id==="fish")s.stock+=w===2?1:3;
 if(id.startsWith("food")){let i=+id.slice(4);s.stock-=4;s.p[i].food+=4;s.p[i].trust=clamp(s.p[i].trust+1,0,10);}
 lines.push({actor:"評議会",title:a.title,detail:t,kind:"player"});
 const event=(id,actor,title,detail)=>{if(!s.milestones.includes(id)){s.milestones.push(id);lines.push({actor,title,detail,kind:"story"});}};
 for(let j=0;j<3;j++){let i=(j+s.day-1)%3,p=s.p[i],o=options(s,i,policy),pick=o[0],f=forecast(s,i);pick.fx();lines.push({actor:people[i].name,title:pick.title,detail:pick.detail,kind:"npc",forecast:weatherNames[f],score:Math.round(pick.score*10)/10,alts:o.slice(1,3).map(x=>[x.title,Math.round(x.score*10)/10])});
 if(pick.id==="share")event("first-share","通信記録","空の籠","『明日はそっちの番だ』。手渡された食料の籠が、初めて地区境界を越えた。");
 if(pick.id==="aid")event("first-aid","通信記録","灯のそばで","地区の代表が自分の仕事を中断して隣区に向かった。帰り道は、二人で歩いた。");
 if(policy!=="none"&&p.trust>=4&&pick.id!==policy&&p.food<=4)event("disagree"+i,people[i].name,"方針への異議","『評議会の事情は分かる。でも今、この地区を空腹のままにはできない』。");}
 for(let i=0;i<3;i++){let p=s.p[i],miss=Math.max(0,3-p.food);p.food=Math.max(0,p.food-3);if(miss){p.hp=clamp(p.hp-2*miss,0,10);p.trust=clamp(p.trust-1,0,10);lines.push({actor:people[i].district+"区",title:"食料不足",detail:"不足 "+miss+" 食、体力 −"+2*miss,kind:"event"});event("hunger"+i,people[i].name,"空の食卓","今夜は配る食料が足りない。代表は食卓の前で、明日の仕事を書き直した。");}}
 if(w===2){let damage=s.wall>=7?0:s.wall>=4?2:3;s.wall=Math.max(0,s.wall-2);if(damage){s.p.forEach(p=>p.hp=clamp(p.hp-damage,0,10));s.light=Math.max(0,s.light-2);}lines.push({actor:"気象",title:"夜の嵐",detail:damage?"各地区の体力 −"+damage+"、灯台 −2、防潮堤 −2":"防潮堤が波を防いだ。防潮堤 −2",kind:"event"});}
 if(s.light>=8)event("beam","リツ","試験点灯","霧の向こうに光の筋が伸びた。『この明るさなら、あの船も気付く』。");
 if(s.bonds.some(b=>b<=1))event("rift","評議会","閉ざされた扉","共有資源を巡る不信から、地区間で物資を融通しにくくなった。");
 if(s.bonds.every(b=>b>=4))event("pact","通信記録","三つの署名","代表たちは互いに連絡を取り合う協定を結んだ。これからは誰か一人の決定ではない。");
 s.log=lines;s.history.push({day:s.day,weather:w,id,policy,lines});if(s.day===9)s.end=ending(s);else s.day++;return s;
 }
 return {people,weatherNames,policies,weather,forecast,fresh,actions,advance};
})();const $=id=>document.getElementById(id);let s=E.fresh(),policy="none";
function save(){try{localStorage.setItem("lantern-council-v1",JSON.stringify({seed:s.seed,history:s.history.map(x=>[x.id,x.policy]),policy}));}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem("lantern-council-v1"));if(!d||!Number.isInteger(d.seed)||!Array.isArray(d.history)||d.history.length>9)return;let n=E.fresh(d.seed);for(const [id,p] of d.history){n=E.advance(n,id,p);if(!n)return;}s=n;if(E.policies.some(p=>p[0]===d.policy))policy=d.policy;}catch(e){}}
function el(t,cls,txt){let n=document.createElement(t);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function button(t,d,fn,cls=""){const b=el("button","choice "+cls);b.type="button";b.append(el("b","",t),el("small","",d));b.onclick=fn;return b;}
function renderLines(lines,where){where.replaceChildren();if(!lines.length){where.append(el("p","mut","まだ記録はない。最初の指令を出そう。"));return;}for(const x of lines){const a=el("div","log "+(x.kind==="story"?"story":""));a.append(el("div","eyebrow",x.actor),el("strong","",x.title),el("p","",x.detail));if(x.alts){const d=el("details");d.append(el("summary","","判断の内訳"),el("div","","本人の予報："+x.forecast+"｜採用 "+x.score+" / "+x.alts.map(y=>y.join(" ")).join(" / ")));a.append(d);}where.append(a);}}
function render(){const w=E.weather(s.seed,s.day);$("weather").textContent="DAY "+String(s.day).padStart(2,"0")+" / "+E.weatherNames[w];$("beam").setAttribute("opacity",String(s.light*.05));$("lightglow").setAttribute("opacity",String(s.light*.09));$("wallmap").setAttribute("opacity",String(.3+s.wall*.07));$("seed").textContent="島番号 "+s.seed;
$("meters").innerHTML=[["備蓄",s.stock,"食"],["資材",s.material,"個"],["防潮堤",s.wall,"/10"],["灯台",s.light,"/10"]].map((x,i)=>'<div class="meter"><div class="eyebrow">'+x[0]+'</div><strong>'+x[1]+'<small class="mut"> '+x[2]+'</small></strong>'+(i>=2?'<div class="bar"><span style="width:'+x[1]*10+'%"></span></div>':'')+'</div>').join("");
$("people").innerHTML=E.people.map((a,i)=>{const p=s.p[i];return '<article class="person"><div class="eyebrow" style="color:'+a.color+'">'+a.district+'区</div><strong>'+a.name+'</strong><p class="mut">'+a.role+'・'+a.goal+'</p><div class="stat"><span>食料</span><b>'+p.food+'</b></div><div class="stat"><span>体力</span><b>'+p.hp+'/10</b></div><div class="bar"><span style="width:'+p.hp*10+'%"></span></div><div class="stat"><span>信頼</span><b>'+p.trust+'/10</b></div></article>'}).join("");
$("bonds").replaceChildren();["港↔工房","港↔高台","工房↔高台"].forEach((n,i)=>$("bonds").append(el("span","bond",n+" 絆 "+s.bonds[i]+"/6")));
renderLines(s.log,$("log"));$("past").replaceChildren();for(const h of [...s.history].reverse()){const d=el("details");d.append(el("summary","","第"+h.day+"日 · "+E.weatherNames[h.weather]));const a=el("div");renderLines(h.lines,a);d.append(a);$("past").append(d);}
