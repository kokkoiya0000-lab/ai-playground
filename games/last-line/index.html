<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111e25"><meta name="description" content="嵐の夜、最後の列車を指令する物語型戦略ゲーム"><title>海図にない駅 | THE LAST LINE</title><style>
:root{color-scheme:dark;--bg:#111e25;--panel:#1c2d32;--line:#415452;--ink:#f2ead7;--mut:#b0bdb6;--gold:#efb96b;--green:#9bc9b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#344a47,transparent 55%),var(--bg);color:var(--ink);font:16px/1.75 system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:950px;margin:auto;padding:22px max(16px,env(safe-area-inset-left)) max(40px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}a{color:var(--mut)}.eyebrow{font:12px/1.6 ui-monospace,monospace;letter-spacing:.13em;color:var(--gold)}.hero{padding:25px 0 16px}h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.045em;line-height:1.12;margin:8px 0}h2{font-size:clamp(23px,4vw,33px);margin:4px 0 12px;line-height:1.3}h3{font-size:16px;margin:0}p{margin:10px 0 16px}.mut{color:var(--mut);font-size:13px}.map{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px;background:#13252b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel)}.metric{padding:10px}.metric strong{font-size:23px;color:var(--gold);font-variant-numeric:tabular-nums;display:block}.layout{display:grid;gap:14px}.panel{padding:clamp(15px,3vw,25px)}.choice{display:block;width:100%;text-align:left;border:1px solid #5c716d;border-radius:10px;background:#263a3e;color:var(--ink);font:inherit;padding:12px 14px;margin-top:9px;cursor:pointer;touch-action:manipulation}.choice b,.choice small{display:block}.choice small{font-size:12px;color:#c3d0c8;line-height:1.6}.choice:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.choice[disabled]{opacity:.4}.primary{background:var(--gold);color:#17262b;border:0;text-align:center;font-weight:750}.primary small{color:#35413b}.station{padding:10px 0;border-bottom:1px solid var(--line)}.station strong{float:right;color:var(--gold)}.bar{height:5px;background:#3c4e50;border-radius:8px;margin:6px 0;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#26363a}.log{list-style:none;padding:0}.log li{border-left:2px solid var(--line);padding:4px 0 14px 12px;margin:8px 0;color:var(--mut);font-size:14px}.log b{color:var(--ink)}.secondary{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mut);font:inherit;padding:8px 12px;touch-action:manipulation;cursor:pointer}summary{margin:14px 0;cursor:pointer}.end{font-size:clamp(32px,7vw,52px);color:var(--gold);font-weight:700;line-height:1.2}.route{display:grid;gap:6px}.route .choice{margin:0}.foot{margin-top:22px;color:var(--mut);font-size:12px}@media(min-width:760px){.layout{grid-template-columns:1.6fr 1fr}.route{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:no-preference){.choice:hover{border-color:var(--gold)}.bar span{transition:width .25s}}
</style></head><body><main><header><a href="../../">← AI Playground</a><span class="eyebrow">NARRATIVE / 002</span></header><div class="hero"><div class="eyebrow">THE LAST LINE · 03:20 AM</div><h1>海図にない駅</h1><p class="mut">最後の列車を、どこへ向かわせるか。</p></div>
<svg class="map" viewBox="0 0 600 220" role="img" aria-label="沿岸鉄道の指令路線図"><defs><pattern id="waves" width="44" height="16" patternUnits="userSpaceOnUse"><path d="M0 9Q11 2 22 9T44 9" fill="none" stroke="#2b454b"/></pattern></defs><rect width="600" height="220" fill="#14262d"/><rect width="600" height="220" fill="url(#waves)"/><path d="M0 0H350L315 65 370 120 295 220H0Z" fill="#2b4140"/><path d="M405 0H600V220H460L490 170 430 110Z" fill="#2b4140"/><path d="M100 59L265 110H360L500 110M100 164L265 110" stroke="#99b6ab" stroke-width="4" fill="none"/><path id="oldline" d="M220 185L265 110" stroke="#efb96b" stroke-width="3" stroke-dasharray="5 7" fill="none"/><g fill="#efb96b" stroke="#14262d" stroke-width="3"><circle cx="100" cy="59" r="8"/><circle cx="100" cy="164" r="8"/><circle id="oldpoint" cx="220" cy="185" r="8" opacity=".35"/><circle cx="500" cy="110" r="8"/></g><g font-size="15" font-family="system-ui" fill="#eee7d5"><text x="38" y="42">中央駅</text><text x="38" y="192">西浜駅</text><text id="oldlabel" x="237" y="193" opacity=".5">旧灯台駅？</text><text x="463" y="91">対岸</text><text x="354" y="92" font-size="11" fill="#b3c8c3">海峡橋</text></g></svg>
<div class="metrics" id="metrics"></div><div class="layout"><section class="panel" id="scene" aria-live="polite"></section><aside class="panel"><div class="eyebrow">DISPATCH BOARD</div><h2>輸送状況</h2><div id="stations"></div><details><summary>通信記録 <span id="logcount"></span></summary><ol class="log" id="log"></ol></details><p class="mut">未輸送者の生死は確定しない。輸送数は列車以外の避難も含む。</p><button class="secondary" id="restart">最初から</button></aside></div><p class="foot">架空の都市・人物・鉄道を題材にした創作ゲームです。現実の災害対応の指針ではありません。</p><noscript>JavaScriptを有効にして開いてください。</noscript></main><script>
const E=(function engine(){
const sites=[{name:"中央駅",n:26,desc:"診療所の患者と住民"},{name:"西浜駅",n:20,desc:"港の作業員と家族"},{name:"旧灯台駅",n:14,desc:"公式名簿に載らない住民"}];
const acts=[
["old",[0],1,[],"廃駅の周波数を呼ぶ","雑音の向こうの声を確認する。","『こちら旧灯台。十四人。名簿には載っていません』。元駅員セツが、一人ずつ名前を読み上げた。"],
["west",[0],0,[],"西浜の船長と連絡","船による代替輸送を調べる。","トウマは潮の向きを読んでいる。『03:40までなら二十人、全員乗せる。電動ポンプの電源を頼む』。"],
["central",[0],0,[],"中央駅の診療所と連絡","高台への陸路を調べる。","ミナが患者を数えている。高台への斜行リフトは電力があれば十二人ずつ運べる。"],
["ledger",[0,1],0,[],"廃線時の台帳を調べる","公式記録と現地の食い違いを調べる。","台帳には『移転完了』の印。だが居住者署名欄は空白だ。誰かが十四人を数字の上から消した。"],
["ferry",[1,2],2,["west"],"西浜の船を動かす","西浜から早期なら20人、後期なら10人避難。",s=>s.turn<4?"船が二十人全員を沖の安全な埠頭へ運んだ。『次はそっちの番だ』とトウマ。":"風が変わった。船は十人だけを運び、残りは駅へ戻った。",s=>s.out[1]+=s.turn<4?20:10],
["lift",[1,2],2,["central"],"診療所のリフトを動かす","中央駅から12人避難。","ミナから十二人の到着報告。『残った人は私が見ています』。",s=>s.out[0]+=12],
["lift2",[2],2,["lift"],"リフトをもう一往復","中央駅からさらに12人避難。","最後の二人は歩行補助が必要で、駅に残った。ミナは一緒に待っている。",s=>s.out[0]+=12],
["survey",[1,2],1,["old"],"旧線の分岐器を点検","旧灯台駅への列車経路を解放し、現地の名簿を確認。","セツが分岐器の安全を確認した。駅舎に残る原本の名簿も送ってきた。指令盤に旧灯台駅の表示が戻る。"],
["van",[1,2],2,["old"],"保守車を旧灯台へ送る","旧灯台駅から8人避難。","保守車が八人を高台に届けた。セツは残った六人の名前を読み上げる。今度は数ではなく、一人ずつ。",s=>s.out[2]+=8],
["seats",[2],1,[],"予備車両を連結","最終列車の定員38人→44人。","整備員が六席の予備車両を連結する。『もう、これ以上は増やせない』。",s=>s.cap+=6],
["report",[2],0,["old"],"訂正された名簿を送信","台帳または現地原本を根拠に住民記録を公的保存。","十四人の名前と証拠を送った。受領印が返る。セツは黙ってから『これで、明日の私たちがいる』と言った。"],
["shelter",[1,2],1,[],"残留者の高台避難所を確保","未輸送者の救援待機場所を確保。","各駅の高台施設が開放された。今夜全員を運べなくても、救援を待つ場所はある。"],
["wait",[0,1,2],0,[],"電力を温存する","時間を一枠進める。","秒針だけが進んだ。線路の向こうで波が砕けている。"]
].map(([id,ph,cost,need,title,hint,text,effect])=>({id,ph,cost,need,title,hint,text,effect}));
const fresh=()=>({turn:0,power:7,done:[],out:[0,0,0],cap:38,log:[],final:null});
const phase=s=>Math.min(2,Math.floor(s.turn/2));
const available=(s,a)=>s.turn<6&&!s.final&&a.ph.includes(phase(s))&&(a.id==="wait"||!s.done.includes(a.id))&&s.power>=a.cost&&a.need.every(k=>s.done.includes(k))&&(a.id!=="report"||s.done.includes("ledger")||s.done.includes("survey"));
function apply(s,id){const a=acts.find(a=>a.id===id);if(!a||!available(s,a))return null;const n={...s,done:[...s.done,id],out:s.out.slice(),log:[...s.log,{title:a.title,text:typeof a.text==="function"?a.text(s):a.text}],power:s.power-a.cost,turn:s.turn+1};if(a.effect)a.effect(n);return n;}
const routes=[[0,1],[1,0],[0,2],[2,0],[1,2],[2,1]];
function predict(s,r){if(s.turn!==6||s.final||!Array.isArray(r)||!routes.some(x=>x.join()===r.join())||(r.includes(2)&&!s.done.includes("survey")))return null;let c=s.cap;const train=[0,0,0];for(const i of r){train[i]=Math.min(c,sites[i].n-s.out[i]);c-=train[i];}const left=sites.map((a,i)=>a.n-s.out[i]-train[i]);return {route:r,train,left,saved:60-left.reduce((a,b)=>a+b,0),record:s.done.includes("report"),shelter:s.done.includes("shelter"),known:s.done.includes("old")};}
function finish(s,r){const final=predict(s,r);return final?{...s,final}:null;}
function ending(f){if(f.saved===60&&f.record)return ["六十人の朝","列車の窓に朝日が差す。避難者名簿には六十人分の名前がある。旧灯台の十四人も、今度は省略されていない。セツが駅名の印刷された切符を握る。『これで、帰る場所の名前を忘れずに済む』。"];if(f.saved===60)return ["全員の朝","全員が海峡の向こうに着いた。しかし旧灯台の正式な記録は送られなかった。セツは濡れた台帳を抱え、明日になったら役所へ行くと言った。"];if(f.record)return ["名前の残る夜","全員を運び出すことはできなかった。それでも救援隊には旧灯台の名前と人数が伝わっている。夜明けの名簿に空欄はない。次の便まで、仕事は終わらない。"];if(f.shelter)return ["高台の灯","列車が橋を渡る。駅の上には避難所の灯が残る。今夜の輸送は終わったが、残った人には次の救援を待つ場所がある。"];if(!f.known)return ["地図の余白","公式報告は『対象駅の輸送終了』。夜明け、旧灯台から十四人の救援要請が届く。地図の空白は、人がいないことを意味していなかった。"];return ["途切れた通信","列車は海峡を渡った。残留者のいる駅へ、もう一度連絡を試みる。返答のない周波数を閉じられない。救援を引き継ぐ者に最後の記録を残した。"];}
return {sites,acts,fresh,phase,available,apply,routes,predict,finish,ending};
})();let s=E.fresh();const $=id=>document.getElementById(id);const times=["03:20","03:25","03:30","03:35","03:40","03:45","03:50"];const chapters=[["第一幕 / 受信","沿岸の町を襲う嵐。03:50に海峡橋が閉鎖される。あなたは最後の列車の指令員。公式名簿には中央駅26人、西浜駅20人。だが廃線の周波数から途切れた呼び声が聞こえる。"],["第二幕 / 選別","船やリフトは列車とは別に人を運べる。ただし指令所の予備電力は有限だ。風が強くなる前に、何を動かすか決めてほしい。"],["第三幕 / 残り時間","橋の閉鎖が迫る。残る二回の指令で、運べる人数も、明日に残る記録も変わる。"]];
function save(){try{localStorage.setItem("last-line-v1",JSON.stringify({done:s.done,route:s.final?.route||null}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("last-line-v1"));if(!d||!Array.isArray(d.done)||d.done.length>6)return;let n=E.fresh();for(const id of d.done){n=E.apply(n,id);if(!n)return;}if(d.route){n=E.finish(n,d.route);if(!n)return;}s=n;}catch(e){}}
function button(title,sub,fn,cls=""){const b=document.createElement("button");b.type="button";b.className="choice "+cls;const t=document.createElement("b"),d=document.createElement("small");t.textContent=title;d.textContent=sub;b.append(t,d);b.onclick=fn;return b;}
function choose(id){const n=E.apply(s,id);if(n){s=n;save();render();}}
function render(){const known=s.done.includes("old");$("metrics").innerHTML='<div class="metric"><span class="eyebrow">TIME</span><strong>'+times[s.turn]+'</strong><span class="mut">残り '+(6-s.turn)+' 指令</span></div><div class="metric"><span class="eyebrow">POWER</span><strong>'+s.power+' / 7</strong><span class="mut">予備電力</span></div><div class="metric"><span class="eyebrow">SEATS</span><strong>'+s.cap+'</strong><span class="mut">列車定員</span></div>';
$("oldpoint").setAttribute("opacity",known?"1":".35");$("oldlabel").setAttribute("opacity",known?"1":".5");$("oldlabel").textContent=known?"旧灯台駅":"旧灯台駅？";$("oldline").setAttribute("stroke-dasharray",s.done.includes("survey")?"none":"5 7");$("stations").innerHTML=E.sites.map((a,i)=>{const show=i!==2||known||s.final;const n=s.out[i]+(s.final?s.final.train[i]:0);return '<div class="station"><h3>'+a.name+'<strong>'+(show?n+' / '+a.n:'不明')+'</strong></h3><div class="bar"><span style="width:'+(show?100*n/a.n:0)+'%"></span></div><div class="mut">'+(show?a.desc:"公式名簿に記載なし")+'</div></div>'}).join("");
$("logcount").textContent="("+s.log.length+")";$("log").replaceChildren();for(const l of [...s.log].reverse()){const li=document.createElement("li"),b=document.createElement("b"),p=document.createElement("div");b.textContent=l.title;p.textContent=l.text;li.append(b,p);$("log").append(li);}
const scene=$("scene");scene.replaceChildren();function head(tag,title,body){const a=document.createElement("div"),h=document.createElement("h2"),p=document.createElement("p");a.className="eyebrow";a.textContent=tag;h.textContent=title;p.textContent=body;scene.append(a,h,p);}
if(s.final){const f=s.final,[title,body]=E.ending(f);head("EPILOGUE",title,body);const p=document.createElement("p");p.className="end";p.textContent=f.saved+" / 60 人";scene.append(p);const q=document.createElement("p");q.textContent="別経路 "+s.out.reduce((a,b)=>a+b,0)+" 人・列車 "+f.train.reduce((a,b)=>a+b,0)+" 人・未輸送 "+(60-f.saved)+" 人。住民記録 "+(f.record?"送信済み":"未送信")+"。";scene.append(q);scene.append(button("もう一度指令する","別の判断で結末を変える",()=>{s=E.fresh();save();render();},"primary"));if(navigator.share)scene.append(button("結果を共有","LINEなどで共有",()=>navigator.share({title:"海図にない駅",text:title+"｜輸送 "+f.saved+"/60 人",url:location.href}).catch(()=>{})));return;}
if(s.turn===6){head("FINAL / 03:50","最後の列車","二つの駅を順に経由して対岸へ渡る。先に停車する駅から乗車するため、座席不足の場合は順序によって結果が変わる。");const wrap=document.createElement("div");wrap.className="route";for(const route of E.routes){const f=E.predict(s,route);if(!f)continue;const name=route.map(i=>E.sites[i].name).join(" → ");wrap.append(button(name,"列車 "+f.train.reduce((a,b)=>a+b,0)+"人・累計輸送 "+f.saved+"人"+(known?"・未輸送 "+(60-f.saved)+"人":""),()=>{if(!confirm(name+" 経由で出発しますか？"))return;s=E.finish(s,route);save();render();}));}scene.append(wrap);if(!s.done.includes("survey")){const p=document.createElement("p");p.className="mut";p.textContent="旧灯台経由は分岐器の安全確認がないため選べません。";scene.append(p);}return;}
const [chapter,body]=chapters[E.phase(s)];head(chapter,times[s.turn]+" の指令",body);if(s.log.length){const p=document.createElement("p");p.className="notice";p.textContent=s.log[s.log.length-1].text;scene.append(p);}for(const a of E.acts){if(!a.ph.includes(E.phase(s))||(a.id!=="wait"&&s.done.includes(a.id))||!a.need.every(k=>s.done.includes(k)))continue;const b=button(a.title,a.hint+" · 電力 "+a.cost,()=>choose(a.id));b.disabled=!E.available(s,a);scene.append(b);}}
$("restart").onclick=()=>{if(confirm("現在の指令を破棄して最初から始めますか？")){s=E.fresh();save();render();}};load();render();
</script></body></html>
